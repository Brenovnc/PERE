<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>PERE — Plataforma Educacional de Repetição Espaçada</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="O PERE ajuda você a lembrar de verdade o que estuda, com sessões curtas de recuperação ativa e repetição espaçada."
    />
    <meta name="theme-color" content="#111111" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="PERE" />
    <meta property="og:url" content="https://pere-estudos.vercel.app/" />
    <meta property="og:title" content="PERE — Plataforma Educacional de Repetição Espaçada" />
    <meta
      property="og:description"
      content="O PERE ajuda você a lembrar de verdade o que estuda, com sessões curtas de recuperação ativa e repetição espaçada."
    />
    <meta property="og:image" content="https://pere-estudos.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PERE — Plataforma Educacional de Repetição Espaçada" />
    <meta
      name="twitter:description"
      content="O PERE ajuda você a lembrar de verdade o que estuda, com sessões curtas de recuperação ativa e repetição espaçada."
    />
    <meta name="twitter:image" content="https://pere-estudos.vercel.app/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Applies the saved (or system) theme before Angular starts, so the page never flashes the wrong theme.
      (() => {
        let theme = 'dark';
        try {
          const saved = localStorage.getItem('pere-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (typeof window.matchMedia === 'function')
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch {
          /* Storage unavailable: keep the dark theme. */
        }
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#111111' : '#F7F5F1');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
