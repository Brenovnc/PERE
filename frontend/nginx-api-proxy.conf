# Used only by docker-compose.yml: sends /api to the API container, so the app and the API share one
# origin (http://localhost:8080) and the session cookies work. Elsewhere (Vercel) the host does this.
location /api/ {
    proxy_pass http://api:5080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}
