server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The Angular build puts a content hash in the name of every script and stylesheet
    # (main-AB12CD34.js), so these files can be cached forever.
    location ~* "-[a-z0-9_]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Extra locations, if any (docker-compose.yml mounts the /api proxy here).
    include /etc/nginx/extra/*.conf;

    # Client-side routes (/teacher/home, /student/...) all serve the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
