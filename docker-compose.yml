# PERE inteiro com um comando: docker compose up -d --build  →  http://localhost:8080
# Só o banco, para desenvolver localmente: docker compose up -d postgres
services:
  postgres:
    image: postgres:17-alpine
    container_name: pere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pere
      POSTGRES_USER: pere
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pere -d pere"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: pere-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: "5080"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=pere;Username=pere;Password=local_dev_password
      # Creates/updates the schema and the demonstration data on startup (both off unless set).
      PERE_APPLY_MIGRATIONS: "true"
      PERE_SEED_DEMO: "true"
      # The app is served over plain http://localhost, so the cookies cannot require HTTPS.
      PERE_ALLOW_INSECURE_COOKIES: "true"

  web:
    build: ./frontend
    container_name: pere-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx-api-proxy.conf:/etc/nginx/extra/api-proxy.conf:ro

volumes:
  postgres_data:
